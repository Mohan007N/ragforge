version: '3.8'

services:
  # ----------------------------------------------------------------
  # Backend API & Hybrid RAG Engine
  # ----------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ragforge-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - WORKERS=${WORKERS:-2}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - ENABLE_AUTH=${ENABLE_AUTH:-false}
      - API_KEYS=${API_KEYS:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:3000,http://localhost:5173}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-phi3:mini}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      - CHUNK_SIZE=${CHUNK_SIZE:-800}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:-150}
    volumes:
      - ragforge-data:/app/data/documents
      - ragforge-chroma:/app/storage/chroma
      - ragforge-bm25:/app/storage/bm25
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - ragforge-net

  # ----------------------------------------------------------------
  # React Modern Glassmorphism UI & Nginx Reverse Proxy
  # ----------------------------------------------------------------
  frontend:
    build:
      context: ./react-frontend
      dockerfile: Dockerfile
    container_name: ragforge-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ragforge-net

  # ----------------------------------------------------------------
  # Optional: Local Ollama LLM Service (Activated with --profile local-llm)
  # ----------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: ragforge-ollama
    restart: unless-stopped
    profiles: ["local-llm"]
    ports:
      - "11434:11434"
    volumes:
      - ragforge-ollama:/root/.ollama
    networks:
      - ragforge-net

volumes:
  ragforge-data:
    name: ragforge_documents_data
  ragforge-chroma:
    name: ragforge_chroma_storage
  ragforge-bm25:
    name: ragforge_bm25_storage
  ragforge-ollama:
    name: ragforge_ollama_models

networks:
  ragforge-net:
    name: ragforge_network
    driver: bridge
